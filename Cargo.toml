# A C++ application hosting Rust screens, and the same thing as an ESP32 image.
#
# `cpp_host` is the worked example of the C ABI, and the only thing that
# compiles, links and *runs* the FreeInkUI shim on a desktop. `firmware` is the
# PlatformIO build of the same boundary for a board.
#
# This repository owns two of the five ABI boundaries: the host's own header
# against the Rust that calls it, and what the application exports against the
# header that declares it. The other three are `xpui-fui`'s and live with it —
# a repository checks the boundary it owns.
[workspace]
# `xtask` is the gate. A member rather than a separate workspace so one
# `cargo test` reaches its tests.
members = ["abi", "cpp_host", "xtask"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Thiago Holanda <unnamedd@gmail.com>"]
repository = "https://github.com/XPUI-Framework/xpui-cpp"

[workspace.dependencies]
# Git dependencies, not versions: nothing is published, and a fresh clone of
# this repository has to build without its siblings on disk.
xpui = { git = "https://github.com/XPUI-Framework/xpui-framework", branch = "main" }
xpui-fui = { git = "https://github.com/XPUI-Framework/xpui-backends", branch = "main" }
xpui-abi-check = { git = "https://github.com/XPUI-Framework/xpui-backends", branch = "main" }

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
too_long_first_doc_paragraph = "deny"

[workspace.lints.rustdoc]
unescaped_backticks = "deny"

# Size over speed: flash is the scarce resource, not cycles.
#
# This workspace is the top of two different builds, and the profile applies to
# both. `firmware/scripts/build_rust.py` runs `cargo build --release` here for
# a device triple, and that archive is linked into an ESP32 image where `"z"`
# is what matters. The gate builds the same crate for the host, where it makes
# no difference — a desktop static library nothing is short of room for.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

# No `strip`: neither board has been run yet, and the first person to run one
# wants symbol names in a backtrace more than a smaller file on the host. It
# costs nothing on the part — a symbol table is in no loadable segment.
