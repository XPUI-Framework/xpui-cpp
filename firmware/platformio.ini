; An ESP32 firmware that hosts xpui screens.
;
;   pio run -e simulator_x3     a desktop window, native
;   pio run -e default          Xteink X3, ESP32-C3
;   pio run -e sticky           Seeed Sticky, ESP32-S3
;
; The Rust half is built by scripts/build_rust.py, which PlatformIO runs as a
; `pre:` script. It picks the target from the environment's MCU, so there is
; one line here and no per-environment Rust configuration.
;
; **Homebrew's `pio` may lack the `littlefs` module** the espressif32 builder
; wants. If a device build fails with `ModuleNotFoundError: No module named
; 'littlefs'`, use ~/.platformio/penv/bin/pio instead.

[platformio]
; The C++ lives in cpp/, because src/ would collide with the cargo layout of
; every other crate here.
src_dir = cpp
default_envs = default

[env]
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    ; Warnings are failures everywhere else in this repository; these five
    ; device files were the only C++ in it with no gate at all.
    -Wall
    -Wextra
    -I$PROJECT_DIR/cpp
    ; FreeInkUI, which `xpui_fui.cpp` binds to. A sibling checkout by default;
    ; point FREEINK_SDK_DIR somewhere else if yours lives elsewhere. Without
    ; it the build stops on `FreeInkApp.h: No such file`, which names the
    ; symptom rather than the cause.
    -I${sysenv.FREEINK_SDK_DIR}/libs/ui/FreeInkUI/include
    -I$PROJECT_DIR/../../../crosspoint-reader/freeink-sdk/libs/ui/FreeInkUI/include
    ; `src/` too, for the one out-of-line source — see cpp/sdk_out_of_line.cpp.
    -I${sysenv.FREEINK_SDK_DIR}/libs/ui/FreeInkUI/src
    -I$PROJECT_DIR/../../../crosspoint-reader/freeink-sdk/libs/ui/FreeInkUI/src
    ; The two headers the framework's own C ABI lives in, straight out of the
    ; backend crate. Not copied — a firmware adds these two paths and is done.
    -I$PROJECT_DIR/../../crates/backend/fui/cpp
    ; The screens, the Platform and the Navigator come from the desktop C++
    ; host unchanged; only the platform-specific host_*.cpp differ.
    -I$PROJECT_DIR/../cpp_host/cpp
extra_scripts = pre:scripts/build_rust.py

; Everything platform-independent is compiled straight from examples/cpp_host
; rather than copied. What a laptop and a device genuinely disagree about is
; input, the panel, device identity and the heap — and those are the files
; under cpp/ here.
build_src_filter =
    +<*>
    +<../../cpp_host/cpp/ScreenHost.cpp>
    +<../../cpp_host/cpp/ScreenStack.cpp>
    +<../../cpp_host/cpp/host_screen.cpp>
    +<../../cpp_host/cpp/host_i18n.cpp>
    ; The shim itself, from the backend crate: the same 882 lines the desktop
    ; host links and the same ones CI syntax-checks.
    +<../../../crates/backend/fui/cpp/xpui_fui.cpp>

; -- the boards --------------------------------------------------------------

; The panel each board actually has, and the keys it has. `Board::X3` and
; `Board::STICKY` in `crates/boards` carry the same two facts, and the
; simulator lays out against those — so a mismatch here is a firmware that
; measures a panel the device does not have, or offers a mode its keys cannot
; drive, and boots looking plausible either way.
;
; `XPUI_HAS_LEFT_RIGHT_KEYS` is the one the framework branches on: without the
; pair, Confirm opens a value control and four keys change meaning while it is
; open. The X3 has the pair; the Sticky does not.
[env:default]
platform = espressif32
board = esp32-c3-devkitm-1
framework = espidf
board_build.mcu = esp32c3
build_flags =
    ${env.build_flags}
    -DXPUI_PANEL_WIDTH=528
    -DXPUI_PANEL_HEIGHT=792
    -DXPUI_HAS_LEFT_RIGHT_KEYS=1

[env:sticky]
platform = espressif32
board = esp32-s3-devkitc1-n16r8
framework = espidf
board_build.mcu = esp32s3
build_flags =
    ${env.build_flags}
    -DXPUI_PANEL_WIDTH=480
    -DXPUI_PANEL_HEIGHT=800
    -DXPUI_HAS_LEFT_RIGHT_KEYS=0

; -- the simulator -----------------------------------------------------------
;
; A window on the machine doing the building, so a screen can be looked at
; without flashing anything — and without learning a second build system,
; which is the point of it being here rather than only in CMake.
;
; It builds the **desktop C++ host**, unchanged: none of `cpp/` is included,
; because every file in there is ESP-IDF. What it shares with the boards above
; is the Rust archive, built for the host triple by the same script — which is
; what makes `build_rust.py`'s host branch worth having.
[env:simulator_x3]
platform = native
build_flags =
    -std=gnu++17
    -I$PROJECT_DIR/../cpp_host/cpp
    -I$PROJECT_DIR/../../crates/backend/fui/cpp
    -I${sysenv.FREEINK_SDK_DIR}/libs/ui/FreeInkUI/include
    -I$PROJECT_DIR/../../../crosspoint-reader/freeink-sdk/libs/ui/FreeInkUI/include
    ; `src/` too, for the one out-of-line source — see cpp/sdk_out_of_line.cpp.
    -I${sysenv.FREEINK_SDK_DIR}/libs/ui/FreeInkUI/src
    -I$PROJECT_DIR/../../../crosspoint-reader/freeink-sdk/libs/ui/FreeInkUI/src
    ; Includes **and** libraries, both in build_flags: PlatformIO passes this
    ; to the compile and the link, and there is no separate link-flags option.
    ; `--cflags` alone compiles cleanly and then fails on every SDL symbol.
    !sdl2-config --cflags --libs
; No -Wall here: this environment compiles the SDK's own source as project
; source, and third-party warnings would bury ours. The desktop host is built
; with -Wall -Wextra by its CMake, which is where that check belongs.
; `-<*>` first: the firmware's own cpp/ is ESP-IDF and cannot build here.
build_src_filter =
    -<*>
    +<sdk_out_of_line.cpp>
    +<../../cpp_host/cpp/*.cpp>
    +<../../../crates/backend/fui/cpp/xpui_fui.cpp>
build_unflags = -std=gnu++11
