[package]
name = "xpui-cpp-host"
description = "The Rust half of a C++ application hosting xpui screens"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
publish = false

[lints]
workspace = true

[lib]
# The name is set explicitly rather than derived from the package, because
# CMake links the archive by path: renaming the package would otherwise move
# `libxpui_cpp_host.a` and the link would fail somewhere far from the cause.
name = "xpui_cpp_host"
path = "src/lib.rs"

# `staticlib` is what C++ links. `rlib` is what a Rust consumer would use, and
# what keeps `cargo build --workspace` honest about this crate compiling.
crate-type = ["staticlib", "rlib"]

# No Rust test harness: every `xpui_host_*` symbol this crate calls is defined
# by the C++ half. `abi/` checks the ABI, and `xpui-host --selftest`, run by
# ctest, proves the whole stack links and draws.
test = false

# Doctests stay on, by cargo's default, with no key here: `src/lib.rs` mounts
# `docs/tutorial.md` and `docs/boundary.md`, so the tutorial's nine Rust
# snippets are compiled on every run. A `doctest = false` would silence them
# and the gate's `doctests` stage would still pass. They link because
# none of them calls across the FFI — a doctest links this crate without the
# C++ half, so a snippet reaching `strings::tr` would fail at the link, which
# is why those modules' own examples are fenced `text`.

# `xpui/testing` installs the deterministic fake host, so the tutorial's
# "prove it without a device" snippets run as doctests. A dev dependency
# because resolver v3 keeps its features out of a normal build — the staticlib
# a firmware links must never be compiled with a fake anything.
[dev-dependencies]
xpui = { workspace = true, features = ["testing"] }

[dependencies]
xpui.workspace = true
# The backend. **Never with `testing`**: that feature swaps every C symbol for
# a host double, so a staticlib built with it links cleanly into the C++ and
# draws nothing at all. Resolver v3 keeps dev-dependency features out of a
# normal build, so nothing here can turn it on by accident — but it is the one
# mistake in this crate that fails silently, so it is written down.
xpui-fui.workspace = true
